<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#00C7BE" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E8EEF5" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#007AFF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background rounded squircle with light liquid glass finish -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#chipGrad)" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2" filter="url(#shadow)" />
  <rect x="8" y="8" width="84" height="84" rx="24" fill="none" stroke="url(#circGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Circuit Trace Lines -->
  <path d="M 22 50 L 36 50 L 44 42 L 56 42 L 64 50 L 78 50" fill="none" stroke="url(#circGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 50 22 L 50 36 L 58 44 L 58 56 L 50 64 L 50 78" fill="none" stroke="url(#circGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- PCB Via Nodes -->
  <circle cx="22" cy="50" r="3.5" fill="#007AFF" />
  <circle cx="78" cy="50" r="3.5" fill="#00C7BE" />
  <circle cx="50" cy="22" r="3.5" fill="#007AFF" />
  <circle cx="50" cy="78" r="3.5" fill="#00C7BE" />

  <!-- Central Silicon IC Die -->
  <rect x="38" y="38" width="24" height="24" rx="7" fill="#FFFFFF" stroke="url(#circGrad)" stroke-width="1.8" />
  
  <!-- AI Core Pulse Dot -->
  <circle cx="50" cy="50" r="4.5" fill="url(#circGrad)" />
</svg>
