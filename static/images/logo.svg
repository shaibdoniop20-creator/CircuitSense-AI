<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35C6C0" />
      <stop offset="100%" stop-color="#5799F7" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262B33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#17191D" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with liquid glow -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#chipGrad)" stroke="url(#circGrad)" stroke-width="2.5" />

  <!-- Circuit Trace Lines -->
  <path d="M 22 50 L 36 50 L 44 42 L 56 42 L 64 50 L 78 50" fill="none" stroke="url(#circGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 22 L 50 36 L 58 44 L 58 56 L 50 64 L 50 78" fill="none" stroke="url(#circGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- PCB Via Nodes -->
  <circle cx="22" cy="50" r="3.5" fill="#35C6C0" filter="url(#glow)" />
  <circle cx="78" cy="50" r="3.5" fill="#5799F7" filter="url(#glow)" />
  <circle cx="50" cy="22" r="3.5" fill="#35C6C0" filter="url(#glow)" />
  <circle cx="50" cy="78" r="3.5" fill="#5799F7" filter="url(#glow)" />

  <!-- Central Silicon IC Die -->
  <rect x="38" y="38" width="24" height="24" rx="6" fill="#17191D" stroke="#35C6C0" stroke-width="1.8" />
  
  <!-- AI Core Pulse Dot -->
  <circle cx="50" cy="50" r="4.5" fill="url(#circGrad)" filter="url(#glow)" />
</svg>
